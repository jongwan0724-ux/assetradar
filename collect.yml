name: 가격 수집

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다(UTC 기준 00:17, 06:17, 12:17, 18:17)
  workflow_dispatch: {}        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ASSETRADAR_SITE: ${{ vars.ASSETRADAR_SITE }}
          ASSETRADAR_UA: ${{ vars.ASSETRADAR_UA }}
        run: python -m collector.run

      - name: 실패 진단 자료 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "assetradar-bot"
          git config user.email "assetradar-bot@users.noreply.github.com"
          git add docs/data docs/feed.xml
          if git diff --cached --quiet; then
            echo "바뀐 가격이 없어요."
          else
            git commit -m "data: 가격 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
