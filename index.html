<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssetRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* VOICE: 사용자 시안 그대로 — 어두운 상단, 라임 포인트, 둥근 흰 카드, 게임 일러스트
   IDEA: 레이더가 세일을 포착하는 대시보드
   PICTURE: 히어로 오른쪽 판타지 마을 일러스트(사용자 제공)+레이더 호, 주목할 딜 큰 카드 3장, 가격 기록 그래프
   COLOUR and TYPE: 먹색 #111315 상단, 라임 #c3f75b 주색, 흰 카드 / Outfit + Noto Sans KR
   LAYOUT: 상단 바 → 히어로 → 겹친 통계 카드 → 주목할 딜 → 가격 추적 표+가격 기록 패널 → 무료 → 관심 → 스토어 → 프로 → 소개 */
:root{color-scheme:light dark;
--bg:light-dark(#f7f8fa,#101215);--card:light-dark(#fff,#191c1e);--ink:light-dark(#111315,#eef0ec);--soft:light-dark(#5d6460,#a2aaa5);
--line:light-dark(#e4e7e2,#2b3033);--zone:light-dark(#eef1ea,#15181a);--lime:#c3f75b;--limeD:light-dark(#4d7c0f,#c3f75b);--limeT:light-dark(#f0fdd4,#263311);--dark:#101215;--tb:150ms;--tc:220ms;--tp:300ms;--ease:cubic-bezier(.2,.7,.2,1);--red:#ef4444}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Pretendard,Inter,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}html{scroll-padding-top:80px}
.wrap{max-width:1280px;margin:0 auto}
.disp{font-family:Pretendard,Inter,"Noto Sans KR",sans-serif;font-weight:800;letter-spacing:-.01em}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:rgba(16,18,21,.78);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#f2f4ef;padding:10px max(3vw,14px);border-bottom:1px solid #23272a}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:24px;color:#fff}
.logo svg{width:30px;height:30px}.logo b{color:var(--lime)}
.pills{display:flex;gap:4px;overflow-x:auto}
.pills a{flex:none;display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:21px;text-decoration:none;font-weight:700;color:#e6e9e3}
.pills a.on{background:var(--lime);color:#111}
.pills a:not(.on):hover{background:#22272a}
.sbox{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:#1c2023;border:1px solid #2e3437;border-radius:22px;padding:0 12px;min-height:44px}
.sbox input{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:16px;min-height:42px;outline:none}
.sbox kbd{font:12px Pretendard,Inter,sans-serif;border:1px solid #444;border-radius:4px;padding:1px 6px;color:#aaa}
.lang{display:flex;border:1px solid #3a4044;border-radius:22px;overflow:hidden}
.lang button{min-height:42px;min-width:52px;border:0;background:transparent;color:#e6e9e3;font:inherit;font-weight:700;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:#111}
/* hero */
.hero{position:relative;background:var(--dark);color:#fff;overflow:hidden;padding:clamp(36px,5vw,64px) max(3vw,14px) 96px}
.hero .art{position:absolute;inset:0 0 0 auto;width:min(62%,900px);background:url(hero.jpg) center/cover}
.hero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--dark) 0%,rgba(17,19,21,.6) 28%,rgba(17,19,21,0) 60%)}
.hero svg.rad{position:absolute;left:44%;top:-40px;width:520px;height:520px;opacity:.9;pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(36px,5.6vw,64px);line-height:1.04;margin:0 0 12px;text-wrap:balance;max-width:12em}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p{font-size:clamp(17px,1.8vw,21px);margin:0 0 24px;color:#e2e6df;max-width:30em}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.b1,.b2{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:10px;font:inherit;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer}
.b1{background:var(--lime);color:#111;border:0}.b2{background:transparent;color:#fff;border:2px solid #fff}
/* stats */
.stats{padding:0 max(3vw,14px);margin-top:-62px;position:relative;z-index:2}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{background:var(--card);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat .ic{width:48px;height:48px;border-radius:50%;background:var(--limeT);color:var(--limeD);display:grid;place-items:center;flex:none}
.stat .ic .ico{width:24px;height:24px}
.stat b{display:block;font:800 clamp(24px,2.6vw,30px)/1.1 Pretendard,Inter,sans-serif}.stat span{color:var(--soft);font-size:15px}
.stat small{display:block;color:var(--soft);font-size:13px}
.sec{padding:clamp(26px,3.6vw,44px) max(3vw,14px) 0}
.sh{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.sh .t{display:flex;gap:12px;align-items:center}
.sh .t .ico{width:34px;height:34px;color:var(--limeD)}
h2{font-size:clamp(24px,2.6vw,30px);line-height:1.1;margin:0}.sh p{margin:2px 0 0;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.chip .ico{width:18px;height:18px}
.chip[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#111}
/* featured */
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fc{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.07);display:flex;flex-direction:column}
.fc .im{position:relative;aspect-ratio:16/8}.fc .im svg.th{display:block;width:100%;height:100%}
.fc .im::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)}
.mk{position:absolute;left:14px;top:14px;z-index:1;display:inline-flex;align-items:center;gap:6px;background:rgba(17,19,21,.85);color:#fff;font-weight:700;font-size:14px;padding:6px 12px;border-radius:18px}
.heart{position:absolute;right:12px;top:10px;z-index:1;width:44px;height:44px;border-radius:50%;border:0;background:rgba(17,19,21,.55);color:#fff;font-size:20px;cursor:pointer}
.heart[aria-pressed=true]{background:var(--lime);color:#111}
.fc .cap{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;color:#fff}
.fc .cap h3{margin:0;font:800 clamp(19px,1.9vw,24px)/1.15 Pretendard,Inter,"Noto Sans KR",sans-serif}
.fc .cap p{margin:2px 0 0;font-size:14px;opacity:.9}
.prow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:800;border-radius:8px;padding:4px 10px;background:var(--lime);color:#111;font-family:Pretendard,Inter,sans-serif}
.was{color:var(--soft);text-decoration:line-through;font-size:15px;white-space:nowrap}
.now{font:800 22px/1 Pretendard,Inter,"Noto Sans KR",sans-serif;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:14px;background:var(--limeT);color:light-dark(#3f6212,#d9f99d);white-space:nowrap;margin-left:auto}
.st .ico{width:15px;height:15px}
.st.sale{background:var(--zone);color:var(--ink)}.st.over{background:var(--zone);color:var(--soft)}.st.soon{background:light-dark(#fef9c3,#3a3208);color:light-dark(#854d0e,#fde68a)}
/* tracker */
.trk{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.07);padding:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sel{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.tblw{max-height:640px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{position:sticky;top:0;background:var(--zone);text-align:left;font-size:13px;color:var(--soft);font-weight:700;padding:10px 8px;white-space:nowrap;z-index:1}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td,tr.row.sel td{background:var(--limeT)}
tr.row.done{opacity:.5}
.an{display:flex;align-items:center;gap:10px;font-weight:700}@media(min-width:601px){table.stack td:first-child{min-width:168px}table.stack td,table.stack th{padding-inline:6px}table.stack .st{font-size:12px;padding:3px 8px}table.stack .an svg{width:44px;height:28px}}#qchip[hidden]{display:none}.spark{width:62px}
.an svg{width:52px;height:32px;border-radius:6px;flex:none}
.mkt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mkt .ico{width:16px;height:16px}
.dp{display:inline-block;background:var(--lime);color:#111;font:800 14px Pretendard,Inter,sans-serif;border-radius:6px;padding:3px 8px;white-space:nowrap}
.bm{width:44px;height:44px;border:0;background:none;color:var(--ink);cursor:pointer;font-size:20px;border-radius:8px}
.bm[aria-pressed=true]{color:var(--limeD)}
.side{position:sticky;top:80px}
.sideh{display:flex;gap:12px;align-items:center}
.sideh svg.th{width:72px;height:72px;border-radius:10px;flex:none}
.sideh h3{margin:0;font:800 20px/1.2 Pretendard,Inter,"Noto Sans KR",sans-serif}
.sideh .meta{color:var(--soft);font-size:14px}
.sacts{display:flex;gap:8px;margin:14px 0}
.sacts .b1{min-height:44px;font-size:15px;padding:0 16px}
.sacts .bm{border:1px solid var(--line)}
.chart{position:relative;height:250px;background:var(--zone);border-radius:12px;margin-top:8px}.chart svg{position:absolute;inset:0;width:100%;height:100%}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.facts div{background:var(--zone);border-radius:10px;padding:8px 10px}.facts span{display:block;font-size:12px;color:var(--soft)}.facts b{font:800 16px Pretendard,Inter,"Noto Sans KR",sans-serif;white-space:nowrap}
.snote{font-size:14px;color:var(--soft);margin:12px 0 0}
.go{display:inline-flex;align-items:center;min-height:44px;font-weight:800;margin-top:6px}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gc{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);display:flex;flex-direction:column}
.gc .im{position:relative;aspect-ratio:16/9}.gc .im svg.th{display:block;width:100%;height:100%}
.gc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{margin:0;font-size:17px;line-height:1.3}.gc .meta{font-size:14px;color:var(--soft)}
.gc a.go{margin-top:auto}
.alertbox{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.alertbox b{color:var(--limeD)}
.empty{padding:30px;text-align:center;color:var(--soft);border:1px dashed var(--line);border-radius:12px}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.store{background:var(--card);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.store .pct{font:800 46px/1 Pretendard,Inter,sans-serif;color:var(--limeD)}.store h3{margin:0;font-size:18px}
.store ul{margin:0;padding-left:18px;color:var(--soft);font-size:15px}
.store a{margin-top:auto;align-self:flex-start}
.pro{margin-top:clamp(30px,4vw,52px);background:var(--dark);color:#eef0ec;padding:clamp(30px,4vw,52px) max(3vw,14px)}
.pro .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.pro h2{color:var(--lime)}.pro p{color:#bfc5bf}
.pro ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pro li{background:#1c2023;border-radius:10px;padding:12px 14px}.pro li b{display:block}.pro li span{color:#bfc5bf;font-size:15px}
.prodone{color:var(--lime);font-weight:700;margin-top:10px;min-height:1.6em}
.about{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.about h3{margin:0 0 4px;font-size:17px}.about p{margin:0;color:var(--soft)}
.ad{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;color:var(--soft);font-size:14px}
footer{margin-top:clamp(30px,4vw,52px);border-top:1px solid var(--line);padding:28px max(3vw,14px)}
footer .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font-size:14px;color:var(--soft)}footer h3{color:var(--ink);font-size:15px;margin:0 0 4px}
@media(max-width:1000px){.trk{grid-template-columns:minmax(0,1fr)}.side{position:static}.stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.feat,.stores,.about,.pro .wrap,footer .wrap{grid-template-columns:minmax(0,1fr)}.hero .art{width:100%;opacity:.45}.hero svg.rad{left:30%}}
@media(max-width:600px){.top{position:static}.top .wrap{gap:8px}.sbox{order:3;flex-basis:100%}.stat{padding:14px}.stat .ic{width:40px;height:40px}.facts{grid-template-columns:minmax(0,1fr)}
 table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:10px 4px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:2px 4px}.stack td.num{text-align:left}.stack td[data-l]::before{content:attr(data-l) " ";color:var(--soft);font-size:12px}.stack td:first-child{grid-column:1/-1}.stack td.hide{display:none}}

/* ── interaction layer ── */
.b1,.b2,.chip,.pills a,.heart,.bm,.lang button,.sbox{transition:background-color var(--tb) ease,color var(--tb) ease,border-color var(--tb) ease,transform var(--tb) ease}
.b1:hover{transform:translateY(-1px);filter:brightness(1.04)}.b1:active,.chip:active{transform:scale(.97)}
.fc,.gc,.store{position:relative;border:1px solid transparent;transition:transform var(--tc) var(--ease),box-shadow var(--tc) var(--ease),border-color var(--tc) ease}
.fc:hover,.gc:hover,.store:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.12);border-color:light-dark(#b6e35a,#5f7a24)}
.im{overflow:hidden}.im svg.th{transition:transform var(--tc) var(--ease)}
.fc:hover .im svg.th,.gc:hover .im svg.th{transform:scale(1.04)}
.pp[aria-pressed=true]{animation:pop 320ms var(--ease)}
@keyframes pop{40%{transform:scale(1.25)}}
.fc::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),#c3f75b,transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity var(--tc) ease;z-index:3;pointer-events:none}
.fc:hover::before{opacity:1}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--zone) 0%,var(--line) 50%,var(--zone) 100%);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.skc{background:var(--card);border-radius:14px;padding:0 0 14px;overflow:hidden}.skc .sk{margin:10px 14px 0;height:14px}.skc .sk.img{margin:0;height:auto;aspect-ratio:16/8;border-radius:0}
.enter{animation:up var(--tp) var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
.hero h1,.hero p,.hero .cta{animation:up 350ms var(--ease) both}.hero p{animation-delay:80ms}.hero .cta{animation-delay:160ms}
.hero .art{will-change:transform}
.sweep{transform-origin:260px 300px;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.blip{animation:blip 5s ease-out infinite}@keyframes blip{0%,8%{opacity:1}60%,100%{opacity:.25}}
tr.row td{transition:background-color var(--tb) ease}
tr.row:hover td{background:light-dark(#f4fde4,#1f2a10)}
.newb{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;background:#111;color:#c3f75b;vertical-align:2px;white-space:nowrap}
.spark{width:84px;height:26px;display:block}.muted{color:var(--soft)}
button.sbox{cursor:pointer;color:#aab0aa;font:inherit;text-align:left}button.sbox span{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.sbox:hover{border-color:#4a5256}
.qchip{background:var(--limeT)!important;border-color:transparent!important}
.rng{display:inline-flex;gap:2px;background:var(--zone);border-radius:9px;padding:3px}
.rng button{min-height:36px;min-width:52px;border:0;border-radius:7px;background:transparent;color:var(--soft);font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:background-color var(--tb),color var(--tb)}
.rng button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chart svg:focus-visible{outline:3px solid var(--lime);outline-offset:-3px;border-radius:12px}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:#101215;color:#fff;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:2}
.tip small{display:block;font-weight:500;color:#c9cec9;font-size:12px}.tip.low{background:#c3f75b;color:#111}.tip.low small{color:#334}
.pal{position:fixed;inset:0;z-index:50;background:rgba(16,18,21,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 14px 14px;opacity:0;transition:opacity 180ms ease}
.pal.on{opacity:1}.pal[hidden]{display:none}
.palbox{width:min(640px,100%);background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;transform:translateY(-8px) scale(.98);transition:transform 180ms var(--ease)}
.pal.on .palbox{transform:none}
.palin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.palin input{flex:1;min-height:58px;border:0;background:none;color:var(--ink);font:inherit;font-size:18px;outline:none}
.palin kbd,.sbox kbd{font:12px Inter,sans-serif;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--soft)}
#pres{list-style:none;margin:0;padding:6px;max-height:min(56vh,440px);overflow:auto}
#pres .gh{font-size:12px;font-weight:700;color:var(--soft);padding:8px 10px 4px}
#pres .po{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:9px;cursor:pointer}
#pres .po[aria-selected=true]{background:var(--limeT)}
#pres .po svg.mini{width:44px;height:26px;border-radius:5px;flex:none}
#pres .po .tx{flex:1;min-width:0}#pres .po .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}#pres .po .tx span{font-size:13px;color:var(--soft)}

 CH={X,Y,pts,t0,end,pl,pr,W,atl:x.atl,k:null};

 if(firstCount){counted=true;countUp()}

}

function palMove(d){if(!pitems.length)return;pi=(pi+d+pitems.length)%pitems.length;document.querySelectorAll("#pres .po").forEach(el=>el.setAttribute("aria-selected",+el.dataset.pi===pi));$("po"+pi)?.scrollIntoView({block:"nearest"});$("pq").setAttribute("aria-activedescendant","po"+pi)}

 if(it.k==="q"){q=it.v.toLowerCase();qc();anim=true;render();go("tracker")}
